[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3"
version = "0.1.0"
description = "SAM 3 inference code from facebookresearch/sam3"
requires-python = ">=3.8"
license = {file = "LICENSE"}
dependencies = [
  "timm>=1.0.17",
  "numpy>=1.26,<2",
  "tqdm",
  "ftfy==6.1.1",
  "regex",
  "iopath>=0.1.10",
  "typing_extensions",
  "huggingface_hub",
  "pycocotools",
]

[tool.setuptools.packages.find]
include = ["sam3*"]

[tool.setuptools.package-data]
sam3 = ["assets/*.txt.gz"]
